name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install requests openpyxl pytest pyflakes "tomli; python_version < '3.11'"
      - run: python -m pyflakes outreach.py tests
      - run: python -m pytest -q tests
      - run: pip install -r requirements-dev.txt
      - run: python -m pyflakes outreach.py app.py tests