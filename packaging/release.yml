# Builds JobWatcherSetup.exe and attaches it to a GitHub Release.
# To use it, copy this file to .github/workflows/release.yml, then:
#     git tag v0.4.0
#     git push origin v0.4.0
# (or run it by hand from the Actions tab; the installer is then under the run's Artifacts).
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the interface
        working-directory: ui
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the app
        run: |
          pip install -e ".[app]" pyinstaller
          pyinstaller --noconfirm packaging/jobwatcher.spec
      - name: Smoke test
        run: dist\JobWatcher\jobwatcher.exe run --show-config
      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ($version -notmatch '^\d') { $version = "0.0.0" }
          iscc /DAppVersion=$version packaging\JobWatcher.iss
      - uses: actions/upload-artifact@v4
        with:
          name: JobWatcherSetup
          path: packaging/Output/JobWatcherSetup.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: packaging/Output/JobWatcherSetup.exe
